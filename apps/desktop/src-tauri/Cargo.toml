[package]
name = "hatoba-desktop"
description = "Tauri shell for the Hatoba desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
# `src/bin/hatoba-cli.rs` is the second binary; the app is this one.
default-run = "hatoba-desktop"

[lib]
name = "hatoba_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
# Reads the app's identifier and executable name for the `hatoba` command (HOST-15).
serde_json.workspace = true

[dependencies]
hatoba-ai.workspace = true
hatoba-cli.workspace = true
hatoba-core.workspace = true
hatoba-local.workspace = true
hatoba-ssh.workspace = true
# WIN-10: the system tray on Windows and Linux.
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-clipboard-manager = "2.4"
tauri-plugin-opener = "2.7"
# AI-07: system notifications, and clicks on them, on every desktop platform.
tauri-plugin-notification = "2.6"
# HOST-13: another launch hands `hatoba …` arguments to the running app.
tauri-plugin-single-instance = "2.5"
# Signed updates (spec §11). Same TLS stack as the update check below; no v1 .zip bundles.
tauri-plugin-updater = { version = "2.13", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta.workspace = true
specta-typescript = "0.0.12"
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
zeroize.workspace = true
uuid.workspace = true
base64.workspace = true
keyring = { version = "3.6", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
dirs = "6"
bytes.workspace = true
async-trait.workspace = true
futures.workspace = true
# The update check's status probe. Same features and TLS stack as hatoba-core's sync transport.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "charset", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# The AI assistant's system prompt names today's local date (spec §13.1).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Host import from other SSH clients (SSH-15): their ANSI and UTF-16 files, Tabby's YAML config,
# and Xshell's `.xts` exports, which are zip files. Versions match hatoba-ai's own.
encoding_rs = "0.8"
serde_yaml_ng = "0.10"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# SecureCRT's XML export. The version tauri already builds.
quick-xml = "0.42"

[dev-dependencies]
# `KdfParams::for_tests()`, so tests can create a vault without the production Argon2 cost.
hatoba-core = { workspace = true, features = ["test-util"] }
# The AI turn tests run against a mock model provider, and the update tests against a mock
# update endpoint.
wiremock = "0.6"
# The update tests run the updater plugin in a mock app.
tauri = { version = "2.12", features = ["test"] }

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.8"
# HOST-13: the user's PATH in HKCU\Environment.
winreg = "0.56"
windows = { version = "0.62", features = [
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Globalization",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
  "Win32_UI_WindowsAndMessaging",
  "Security_Credentials",
  "Security_Credentials_UI",
  "Security_Cryptography",
  "Storage_Streams",
  "Foundation",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Painted window chrome (linux_chrome.rs): window-state signals, shadow width, input shape.
gtk = "0.18"
# WIN-10: whether a StatusNotifier host shows the tray icon. The opener and single-instance
# plugins already build it.
zbus = "5"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"
# `killpg` for the login shell that resolves the MCP servers' PATH.
libc = "0.2"
# The user's preferred languages (`NSLocale`); a Finder-launched app has no `LANG`.
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSLocale", "NSString"] }
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["std", "LAContext", "LABiometryType", "LAError"] }
security-framework = { version = "3.7.0", default-features = false, features = ["OSX_10_15"] }
security-framework-sys = { version = "2.17.0", default-features = false, features = ["OSX_10_15"] }

[features]
# Enables devtools in release builds. Never enabled for distributed builds (SEC-05).
devtools = ["tauri/devtools"]
