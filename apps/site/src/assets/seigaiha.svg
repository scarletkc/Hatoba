<svg xmlns="http://www.w3.org/2000/svg" width="112" height="56" viewBox="0 0 112 56">
  <!-- The seigaiha (青海波) of the app icon: rows of concentric rings, each row covering the one above
       it. The mask keeps the rings' lines and hides what the next row covers. -->
  <defs>
    <g id="r" stroke="#fff" stroke-width="5">
      <circle r="56" fill="#000"/>
      <circle r="40.3" fill="none"/>
      <circle r="24.6" fill="none"/>
      <circle r="9" fill="none"/>
    </g>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="112" height="56">
      <use href="#r" x="56" y="-28"/>
      <use href="#r" x="0" y="0"/>
      <use href="#r" x="112" y="0"/>
      <use href="#r" x="56" y="28"/>
      <use href="#r" x="0" y="56"/>
      <use href="#r" x="112" y="56"/>
      <use href="#r" x="56" y="84"/>
    </mask>
  </defs>
  <rect width="112" height="56" fill="#fff" mask="url(#m)"/>
</svg>
