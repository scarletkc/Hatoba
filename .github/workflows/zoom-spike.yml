# Temporary spike for #268; removed before the PR merges.
name: Zoom spike

on:
  push:
    branches: [scarletkc/zoom-text-sizes]
    paths: ['spike/**', '.github/workflows/zoom-spike.yml']

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gir1.2-webkit2-4.1 python3-gi xvfb
      - run: xvfb-run -a python3 spike/webkit_zoom.py spike/zoom_page.js
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift spike/webkit_zoom.swift spike/zoom_page.js
