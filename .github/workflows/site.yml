name: Site

# Builds the website in apps/site and deploys it to GitHub Pages, which serves it at
# hatoba.fog.moe. The build reads the newest release from GitHub, and its docs and the app's demo
# come from that release, so the Release workflow calls this one after publishing; pull requests
# only build it, with the demo of their own apps/desktop.
on:
  push:
    branches: [main]
    # The paths under pull_request, without apps/desktop: the demo on the site follows the release.
    paths:
      - apps/site/**
      - crates/hatoba-ai/src/skills/builtin/hatoba/**
      - docs/media/**
      - apps/desktop/src-tauri/app-icon.svg
      - apps/desktop/src-tauri/icons/**
      - apps/desktop/src-tauri/tauri.conf.json
      - scripts/release/**
      - README.md
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/site.yml
  pull_request:
    paths:
      - apps/site/**
      # The demo (apps/site/scripts/demo.mjs).
      - apps/desktop/src/**
      - apps/desktop/public/**
      - apps/desktop/index.html
      - apps/desktop/package.json
      - apps/desktop/vite.config.ts
      - crates/hatoba-ai/src/skills/builtin/hatoba/**
      - docs/media/**
      - apps/desktop/src-tauri/app-icon.svg
      - apps/desktop/src-tauri/icons/**
      - apps/desktop/src-tauri/tauri.conf.json
      - scripts/release/**
      - README.md
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/site.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Deploying runs build and deploy one run at a time, so an older run cannot deploy over a newer one;
# a newer run waiting replaces any older one still waiting. A pull request's newer push cancels its
# older build.
concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.head_ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Reads the releases without the unauthenticated rate limit.
      GITHUB_TOKEN: ${{ github.token }}
      # A pull request's demo is its own apps/desktop, so a change that breaks the demo fails here.
      HATOBA_DEMO_REF: ${{ github.event_name == 'pull_request' && 'worktree' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The docs come from the release's tag.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @hatoba/site --filter @hatoba/desktop
      - run: pnpm --filter @hatoba/site typecheck
      - run: pnpm --filter @hatoba/site test
      - run: pnpm --filter @hatoba/site demo
      - run: pnpm --filter @hatoba/site build
      # Uses the runner's Chrome.
      - run: pnpm --filter @hatoba/site demo:check
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
