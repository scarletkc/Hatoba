name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  # No paths filter: the ruleset on main requires these checks, so a skipped run would block the PR.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR runs are cancelled; every main commit runs to completion so it gets a result
# and saves the Rust cache.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Keeps line numbers in backtraces; smaller target/ (and cache) and faster linking than full debuginfo.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # The ruleset on main merges a pull request only when it is up to date with main and passed CI, so
  # a push to main would repeat that run on the same files. When the pull request of the pushed
  # commit did pass on them, the push skips the tests, and the Rust jobs only check that main still
  # has their cache. The builds that only pushes run are not affected.
  tested:
    name: Tested by pull request
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Reads the pull request of the pushed commit and its CI runs.
      actions: read
      pull-requests: read
    outputs:
      tested: ${{ steps.tested.outputs.tested }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The parent commit is main before the merge, which the pull request has to include.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: tested
        run: node scripts/ci/tested.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  frontend:
    name: Frontend
    needs: tested
    # Runs unless the tested job found that the pull request passed, so it also runs when that job
    # fails or is skipped, as it is for pull requests and manual runs.
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm format:check
      - run: pnpm --filter @hatoba/ui --filter @hatoba/desktop typecheck
      - run: pnpm --filter @hatoba/ui --filter @hatoba/desktop lint
      - run: pnpm --filter @hatoba/ui --filter @hatoba/desktop test:coverage
      - name: Coverage summary
        run: |
          node -e '
            const fs = require("node:fs");
            const rows = [
              ["@hatoba/desktop", "apps/desktop/coverage/coverage-summary.json"],
              ["@hatoba/ui", "packages/ui/coverage/coverage-summary.json"],
            ].map(([name, file]) => {
              const { total } = JSON.parse(fs.readFileSync(file, "utf8"));
              const pct = (m) => `${m.pct}% (${m.covered}/${m.total})`;
              return `| ${name} | ${pct(total.lines)} | ${pct(total.statements)} | ${pct(total.functions)} | ${pct(total.branches)} |`;
            });
            fs.appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              [
                "### Frontend coverage",
                "",
                "| Package | Lines | Statements | Functions | Branches |",
                "| --- | --- | --- | --- | --- |",
                ...rows,
                "",
              ].join("\n"),
            );
          '
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: |
            apps/desktop/coverage/lcov.info
            apps/desktop/coverage/coverage-summary.json
            packages/ui/coverage/lcov.info
            packages/ui/coverage/coverage-summary.json
          if-no-files-found: error
      - run: pnpm --filter @hatoba/desktop build

  worker:
    name: Sync Worker
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/sync
    steps:
      - uses: actions/checkout@v4
        with:
          # The version check compares with the parent commit: the base branch of a pull
          # request's merge commit, or the previous commit on main.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/sync/package-lock.json
      # A manual run can be on a branch, where the parent commit is not where the branch left main.
      # Pull requests and pushes to main already check every change.
      - name: Worker version is raised when the Worker changes
        if: github.event_name != 'workflow_dispatch'
        working-directory: .
        run: node scripts/ci/worker-version.mjs HEAD^1
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  scripts:
    name: Release scripts
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Includes checks that the app's version files agree, and that the Worker's do.
      - run: node --test "scripts/**/*.test.mjs"

  # Pull requests that change nothing the Rust jobs build or check, apart from the release version,
  # skip them. A job skipped by its `if` passes as a required check. Pushes and manual runs start
  # them all.
  changes:
    name: Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Compares with the base branch, the parent of the pull request's merge commit.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: changes
        run: node scripts/ci/changes.mjs HEAD^1

  rust-linux:
    name: Rust (Linux, SSH integration)
    needs: [changes, tested]
    # Runs unless the changes job found no Rust inputs, so it also runs when that job fails or is
    # skipped.
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # On a push that the pull request already tested, this only looks up the cache that the step
      # below would restore, and the job ends here when main has it. Without it, as after a
      # dependency change or a new Rust release, the job runs in full and saves one, because pull
      # requests can only restore the caches that main saved.
      - uses: Swatinem/rust-cache@v2
        id: cached
        if: needs.tested.outputs.tested == 'true'
        with:
          lookup-only: true
          save-if: false
      - uses: Swatinem/rust-cache@v2
        if: steps.cached.outputs.cache-hit != 'true'
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/setup-tauri-linux
        if: steps.cached.outputs.cache-hit != 'true'
        with:
          ssh: true
      - uses: ./.github/actions/setup-node-pnpm
        if: steps.cached.outputs.cache-hit != 'true'
      - name: Build frontend (embedded by tauri::generate_context!)
        if: steps.cached.outputs.cache-hit != 'true'
        run: pnpm --filter @hatoba/desktop build
      - if: steps.cached.outputs.cache-hit != 'true'
        run: cargo fmt --all --check
      # rustfmt leaves comments alone on stable, so this keeps them within its 100 columns.
      - if: steps.cached.outputs.cache-hit != 'true'
        run: node scripts/ci/comment-width.mjs
      - if: steps.cached.outputs.cache-hit != 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (incl. OpenSSH integration tests)
        if: steps.cached.outputs.cache-hit != 'true'
        run: cargo test --workspace
        env:
          HATOBA_SSH_IT: "1"
      - name: TypeScript bindings are up to date
        if: steps.cached.outputs.cache-hit != 'true'
        run: git diff --exit-code apps/desktop/src/ipc/bindings.ts

  rust-windows:
    name: Rust (Windows)
    needs: [changes, tested]
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Only looks up the cache on a push that the pull request already tested, as in the Linux job.
      - uses: Swatinem/rust-cache@v2
        id: cached
        if: needs.tested.outputs.tested == 'true'
        with:
          lookup-only: true
          save-if: false
      - uses: Swatinem/rust-cache@v2
        if: steps.cached.outputs.cache-hit != 'true'
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/setup-node-pnpm
        if: steps.cached.outputs.cache-hit != 'true'
      - if: steps.cached.outputs.cache-hit != 'true'
        run: pnpm --filter @hatoba/desktop build
      - if: steps.cached.outputs.cache-hit != 'true'
        run: cargo test --workspace

  windows-installer:
    name: Windows installer
    # The release profile (fat LTO, one codegen unit) is a second full build, so PRs skip it.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # No Rust cache: the release build shares no artifacts with the test builds, and caching it
      # too takes the repository past its 10 GB Actions cache limit, which evicts the test jobs'
      # caches.
      - uses: ./.github/actions/setup-node-pnpm
      # Only the Release workflow has the update signing key.
      - run: pnpm tauri build --bundles nsis --no-sign
      - uses: actions/upload-artifact@v4
        with:
          name: hatoba-windows-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  linux-packages:
    name: Linux packages
    # A release build without a Rust cache, like the Windows installer above, so PRs skip it.
    if: github.event_name != 'pull_request'
    # The runner of the Linux build in release.yml, whose glibc the packages require.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tauri-linux
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-node-pnpm
      # Only the Release workflow has the update signing key.
      - run: pnpm tauri build --bundles deb,appimage --no-sign
      - uses: actions/upload-artifact@v4
        with:
          name: hatoba-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  rust-macos:
    name: Rust (macOS)
    needs: [changes, tested]
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Only looks up the cache on a push that the pull request already tested, as in the Linux job.
      - uses: Swatinem/rust-cache@v2
        id: cached
        if: needs.tested.outputs.tested == 'true'
        with:
          lookup-only: true
          save-if: false
      - uses: Swatinem/rust-cache@v2
        if: steps.cached.outputs.cache-hit != 'true'
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/setup-node-pnpm
        if: steps.cached.outputs.cache-hit != 'true'
      - if: steps.cached.outputs.cache-hit != 'true'
        run: pnpm --filter @hatoba/desktop build
      # The first run that compiles the macOS-only code, such as platform/window.rs.
      - if: steps.cached.outputs.cache-hit != 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The SSH integration tests stay off here: their harness needs Linux and root to start sshd.
      - if: steps.cached.outputs.cache-hit != 'true'
        run: cargo test --workspace

  macos-bundle:
    name: macOS app bundle
    # A release build without a Rust cache, like the Windows installer above, so PRs skip it.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-node-pnpm
      # Only the Release workflow has the update signing key, so this build signs its updater
      # archive with a throwaway key that this checkout's tauri.conf.json trusts instead. The
      # release script then checks the archive as the Release workflow does, before a release
      # depends on it. The DMG therefore trusts the throwaway key and cannot install real updates.
      - name: Trust a throwaway update signing key
        run: |
          pnpm tauri signer generate --ci -p ci -w "$RUNNER_TEMP/update.key"
          node -e '
            const fs = require("fs");
            const file = "apps/desktop/src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(file, "utf8"));
            config.plugins.updater.pubkey = fs.readFileSync(`${process.env.RUNNER_TEMP}/update.key.pub`, "utf8").trim();
            fs.writeFileSync(file, JSON.stringify(config, null, 2));
          '
      # The CI environment variable makes the DMG step skip the Finder window layout, which fails on a
      # runner without a desktop session. No --no-sign, which would also drop the ad-hoc code signature.
      - name: Build app bundle and DMG
        run: pnpm tauri build --bundles app,dmg
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.temp }}/update.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ci
      - name: Check the release files
        run: node scripts/release/release.mjs dist --platform macos --bundle target/release/bundle --output "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: hatoba-macos-dmg
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
