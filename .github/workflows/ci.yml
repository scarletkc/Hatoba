name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  # No paths filter: the ruleset on main requires these checks, so a skipped run would block the PR.
  pull_request:
  workflow_dispatch:

# Superseded PR runs are cancelled; every main commit runs to completion so it gets a result
# and saves the Rust cache.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Keeps line numbers in backtraces; smaller target/ (and cache) and faster linking than full debuginfo.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hatoba/desktop typecheck
      - run: pnpm --filter @hatoba/desktop test
      - run: pnpm --filter @hatoba/desktop build

  worker:
    name: Sync Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/sync
    steps:
      - uses: actions/checkout@v4
        with:
          # The version check compares with the parent commit: the base branch of a pull
          # request's merge commit, or the previous commit on main.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/sync/package-lock.json
      # A manual run can be on a branch, where the parent commit is not where the branch left main.
      # Pull requests and pushes to main already check every change.
      - name: Worker version is raised when the Worker changes
        if: github.event_name != 'workflow_dispatch'
        working-directory: .
        run: node scripts/ci/worker-version.mjs HEAD^1
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Includes checks that the app's version files agree, and that the Worker's do.
      - run: node --test "scripts/**/*.test.mjs"

  rust-linux:
    name: Rust (Linux, SSH integration)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev openssh-server openssh-client
          # sshd will not start without its privilege separation directory, which the service unit
          # normally creates; the tests run as the runner user and cannot create it themselves.
          sudo install -d -m 0755 /run/sshd
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Build frontend (embedded by tauri::generate_context!)
        run: pnpm install --frozen-lockfile && pnpm --filter @hatoba/desktop build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (incl. OpenSSH integration tests)
        run: cargo test --workspace
        env:
          HATOBA_SSH_IT: "1"
      - name: TypeScript bindings are up to date
        run: git diff --exit-code apps/desktop/src/ipc/bindings.ts

  rust-windows:
    name: Rust (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hatoba/desktop build
      - run: cargo test -p hatoba-core -p hatoba-ssh -p hatoba-desktop
      # The release profile (fat LTO, one codegen unit) is a second full build, so PRs skip it.
      - name: Build NSIS installer
        if: github.event_name != 'pull_request'
        run: pnpm tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: hatoba-windows-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: warn
