name: Release

# Publishes the version in Cargo.toml as a GitHub Release of the selected commit, after approval in
# the release environment. docs/releasing.md describes the steps.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Reads the CI runs and the release environment.
      actions: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The tags and history select the previous release and the changelog.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "scripts/**/*.test.mjs"
      - run: node scripts/release/release.mjs check
      - id: release
        run: node scripts/release/release.mjs outputs >> "$GITHUB_OUTPUT"
      - run: node scripts/release/release.mjs gate
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node scripts/release/release.mjs notes --output release-notes.md
      - name: Show the release notes in the run summary
        run: cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build-windows:
    name: Build (Windows)
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 90
    # Holds the update signing key. It allows only main and has no required reviewers, because this
    # job runs before the approval that the publish job waits for.
    environment: release-signing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # No Rust cache: the installer is built from a clean target directory.
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - run: node scripts/release/release.mjs dist --platform windows --bundle target/release/bundle --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: hatoba-windows
          path: dist/
          if-no-files-found: error

  build-linux:
    name: Build (Linux)
    needs: preflight
    # The packages run only on systems with at least the glibc they were built against, so they are
    # built on an older Ubuntu LTS than ubuntu-latest.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    # Holds the update signing key, as for the Windows build.
    environment: release-signing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev
      # No Rust cache: the packages are built from a clean target directory.
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles deb,appimage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - run: node scripts/release/release.mjs dist --platform linux --bundle target/release/bundle --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: hatoba-linux
          path: dist/
          if-no-files-found: error

  build-macos:
    name: Build (macOS)
    needs: preflight
    # Apple Silicon.
    runs-on: macos-latest
    timeout-minutes: 90
    # Holds the update signing key, as for the Windows build.
    environment: release-signing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # No Rust cache: the app is built from a clean target directory.
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Without --no-sign, so the app keeps the ad-hoc code signature that tauri.conf.json asks for;
      # Apple Silicon Macs report an unsigned download as damaged. The CI environment variable makes
      # the DMG step skip the Finder window layout, which fails on a runner without a desktop session.
      - run: pnpm tauri build --bundles app,dmg
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - run: node scripts/release/release.mjs dist --platform macos --bundle target/release/bundle --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: hatoba-macos
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish
    needs: [preflight, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The environment's required reviewers hold this job until someone approves the run.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: release-notes
      - uses: actions/download-artifact@v4
        with:
          pattern: hatoba-*
          path: dist
          merge-multiple: true
      - run: node scripts/release/release.mjs publish --notes release-notes/release-notes.md --dist dist
        env:
          GH_TOKEN: ${{ github.token }}

  # Rebuilds the website, whose download page offers the newest release and whose docs describe it.
  # A release published with github.token starts no other workflow, so this one calls it.
  site:
    name: Site
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/site.yml

  # Each stable release updates the winget and AUR packages, while Scoop's Extras bucket finds the
  # release by itself. Prereleases are not submitted. A failure here leaves the published release as
  # it is; docs/releasing.md describes the setup and how to retry.
  winget:
    name: winget
    needs: [preflight, publish]
    if: needs.preflight.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Holds the tokens of the package managers. It allows only main and has no required reviewers:
    # the release is already approved and published. The actions that get them are pinned to a
    # commit.
    environment: packages
    steps:
      # Opens a pull request in microsoft/winget-pkgs from the owner's fork, with the manifests of
      # the latest version there updated to this release's installer.
      - uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: ScarletKc.Hatoba
          release-tag: ${{ needs.preflight.outputs.tag }}
          installers-regex: '_windows-x64-setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}

  aur:
    name: AUR
    needs: [preflight, publish]
    # Runs once the repository variable AUR_PUBLISH is true, when the AUR account can push.
    if: needs.preflight.outputs.prerelease == 'false' && vars.AUR_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Holds the AUR SSH key, as for the winget job.
    environment: packages
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set the version in the PKGBUILD
        run: sed -i -e "s/^pkgver=.*/pkgver=${VERSION}/" -e 's/^pkgrel=.*/pkgrel=1/' packaging/aur/PKGBUILD
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
      # Fills in the checksums from the release's files, builds the package to check it, and pushes
      # the PKGBUILD with its .SRCINFO to the AUR. It commits nothing when the AUR already has them.
      - uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: hatoba-bin
          pkgbuild: packaging/aur/PKGBUILD
          updpkgsums: true
          test: true
          commit_username: ScarletKc
          commit_email: i@scarletkc.com
          commit_message: Update to ${{ needs.preflight.outputs.version }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
