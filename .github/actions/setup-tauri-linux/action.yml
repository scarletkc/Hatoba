name: Setup Tauri Linux dependencies
description: Install Tauri system packages on Ubuntu, optionally with OpenSSH for integration tests.
inputs:
  ssh:
    description: Also install openssh-server/openssh-client and create /run/sshd for SSH integration tests.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: System dependencies
      shell: bash
      env:
        INSTALL_SSH: ${{ inputs.ssh }}
      run: |
        pkgs=(
          libwebkit2gtk-4.1-dev
          libgtk-3-dev
          librsvg2-dev
          libayatana-appindicator3-dev
          libdbus-1-dev
        )
        if [ "$INSTALL_SSH" = "true" ]; then
          pkgs+=(openssh-server openssh-client)
        fi
        sudo apt-get update
        sudo apt-get install -y "${pkgs[@]}"
        if [ "$INSTALL_SSH" = "true" ]; then
          # sshd will not start without its privilege separation directory, which the service unit
          # normally creates; the tests run as the runner user and cannot create it themselves.
          sudo install -d -m 0755 /run/sshd
        fi
