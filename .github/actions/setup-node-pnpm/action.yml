name: Setup Node.js and pnpm
description: Set up pnpm, Node.js 22 with pnpm caching, and install workspace dependencies.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
