[package]
name = "hatoba-ai"
description = "Model provider adapters, web tools and MCP client for the Hatoba AI assistant"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# `process`: MCP stdio servers run as child processes.
tokio = { workspace = true, features = ["process"] }
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true
futures.workspace = true
bytes.workspace = true
url = "2.5"
# Same TLS stack as hatoba-core's sync transport: rustls with the `ring` provider, no native-tls.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "charset", "system-proxy", "stream", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# fetch_url: HTML to Markdown (pure Rust, html5ever based), and charset decoding of fetched pages
# (encoding_rs is already in the tree through reqwest's `charset` feature).
htmd = "0.5"
encoding_rs = "0.8"
# fetch_url: the title, base URL and links of the tree htmd converts (the version htmd uses).
markup5ever_rcdom = "0.38"
# fetch_url: where a page's main content is (a port of Mozilla's Readability), and the page's own
# HTML of it. dom_query is the DOM dom_smoothie works on.
dom_smoothie = "0.18"
dom_query = "0.28"
# MCP client (spec §13.9): client features only, JSON-RPC over a child's pipes and Streamable HTTP.
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-async-rw", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
# MCP stdio servers: PATH/PATHEXT lookup, and spawning in a Job Object (Windows) or process group
# (Unix) so shutdown kills the whole tree. No `tracing` feature: it would log the command's env.
which = "8"
process-wrap = { version = "10", default-features = false, features = ["tokio1", "job-object", "creation-flags", "kill-on-drop", "process-group"] }
# grep (AI-48): patterns checked as rg checks them, and translated for grep -E. Already in the
# desktop app through `regex`, with the same features.
regex-syntax = "0.8"
# Skills (spec §13.8): SKILL.md frontmatter and .zip import / export.
serde_yaml_ng = "0.10"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
# CREATE_NO_WINDOW for MCP stdio servers, in the type process-wrap's `CreationFlags` takes.
windows = { version = "0.62", features = ["Win32_System_Threading"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
wiremock = "0.6"
tempfile = "3"
