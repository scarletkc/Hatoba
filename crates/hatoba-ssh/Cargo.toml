[package]
name = "hatoba-ssh"
description = "SSH sessions, PTY, SFTP, port forwarding and key handling for Hatoba"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true
async-trait.workspace = true
base64.workspace = true
sha2.workspace = true
bytes.workspace = true
futures.workspace = true
# `ring` instead of the default `aws-lc-rs` backend: no NASM/CMake needed for Windows builds.
russh = { version = "0.64.1", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3"
# Legacy encrypted PEM (Proc-Type: 4,ENCRYPTED) decryption; versions match russh's own.
aes = "0.9"
cbc = "0.2"
md5 = "0.8"

[dev-dependencies]
tempfile = "3"
serde_json.workspace = true
