[workspace]
resolver = "3"
members = ["crates/hatoba-core", "crates/hatoba-ssh", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/scarletkc/Hatoba"
rust-version = "1.90"

[workspace.dependencies]
hatoba-core = { path = "crates/hatoba-core" }
hatoba-ssh = { path = "crates/hatoba-ssh" }
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
async-trait = "0.1"
base64 = "0.22"
sha2 = "0.11"
uuid = { version = "1", features = ["v7", "serde"] }
bytes = "1"
futures = "0.3"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
